<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mayflower CV Directory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      /* Ocean */
      background: #dceff2;

      color: #172b3a;
      min-height: 100vh;

      padding: 50px 8%;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    /* One Piece inspired logo */
    .logo {
      width: 58px;
      height: 58px;

      background: #f4e4bd;
      color: #b52b2b;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;
      font-weight: bold;

      border: 3px solid #d19a2a;

      margin-bottom: 35px;

      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;

      color: #173b5c;

      letter-spacing: -1px;
    }

    .subtitle {
      color: #526a78;
      font-size: 17px;
      margin-bottom: 40px;
    }

    .subtitle span {
      color: #b52b2b;
      font-weight: bold;
    }

    .divider {
      height: 2px;

      background: #d19a2a;

      margin-bottom: 45px;
      opacity: 0.6;
    }

    ul {
      list-style: none;

      display: flex;
      flex-direction: column;

      gap: 13px;
    }

    li {
      background: #f7efd9;

      border: 1px solid #d8c89f;

      border-radius: 6px;

      overflow: hidden;

      transition: 0.25s ease;

      box-shadow: 0 3px 8px rgba(32, 57, 70, 0.08);
    }

    li:hover {
      transform: translateX(7px);

      border-color: #b52b2b;

      box-shadow: 0 7px 18px rgba(181, 43, 43, 0.15);
    }

    a {
      text-decoration: none;

      color: #243746;

      display: flex;

      align-items: center;

      padding: 20px 24px;

      font-size: 18px;

      font-weight: bold;
    }

    .number {
      width: 38px;
      height: 38px;

      border: 2px solid #d19a2a;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #b52b2b;

      font-size: 14px;

      margin-right: 18px;

      background: #fff8e7;
    }

    .arrow {
      margin-left: auto;

      color: #b52b2b;

      font-size: 24px;

      transition: 0.25s ease;
    }

    li:hover .arrow {
      transform: translateX(6px);
      color: #d19a2a;
    }

    footer {
      border-top: 2px solid #d19a2a;

      margin-top: 40px;

      padding-top: 28px;

      text-align: center;

      color: #617580;

      font-size: 14px;
    }

    footer span {
      color: #b52b2b;
    }

    @media (max-width: 600px) {

      body {
        padding: 35px 20px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 15px;
      }

      a {
        padding: 17px;
        font-size: 16px;
      }

      .number {
        width: 34px;
        height: 34px;

        margin-right: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ☠
    </div>

    <h1>Mayflower CV Directory</h1>

    <div class="subtitle">
      <span>ITE 386</span> — Cloud Programming
    </div>

    <div class="divider"></div>

    <ul>

      <li>
        <a href="lim.html" target="_blank">
          <span class="number">01</span>
          <span>Frances Aura Lim CV</span>
          <span class="arrow">→</span>
        </a>
      </li>

      <li>
        <a href="fernandez.html" target="_blank">
          <span class="number">02</span>
          <span>Fernandez Mar Russel CV</span>
          <span class="arrow">→</span>
        </a>
      </li>

      <li>
        <a href="salinas.html" target="_blank">
          <span class="number">03</span>
          <span>Mary Lorraine CV</span>
          <span class="arrow">→</span>
        </a>
      </li>

      <li>
        <a href="zarate.html" target="_blank">
          <span class="number">04</span>
          <span>Zarate Abegail CV</span>
          <span class="arrow">→</span>
        </a>
      </li>

      <li>
        <a href="estrada.html" target="_blank">
          <span class="number">05</span>
          <span>Estrada Ronald CV</span>
          <span class="arrow">→</span>
        </a>
      </li>

    </ul>

    <footer>
      <span>☠</span>
      Mayflower Pirates — ITE 386 Cloud Programming
    </footer>

  </div>

</body>
</html>
