<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mayflower CV Directory</title>

  <style>
    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================
       BODY
    ========================================= */

    body {
      font-family: Arial, Helvetica, sans-serif;

      background: #0b3d5c;

      color: #f8f5ed;

      min-height: 100vh;

      padding: 80px 24px;

      position: relative;

      overflow-x: hidden;
    }


    /* =========================================
       SUBTLE BACKGROUND DETAILS
    ========================================= */

    body::before {
      content: "";

      position: fixed;

      width: 700px;
      height: 700px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.025);

      top: -300px;
      right: -250px;

      pointer-events: none;
    }

    body::after {
      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.08);

      bottom: -250px;
      left: -200px;

      pointer-events: none;
    }


    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .container {
      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      position: relative;

      z-index: 1;
    }


    /* =========================================
       HEADER
    ========================================= */

    h1 {
      font-size: 38px;

      line-height: 1.2;

      margin-bottom: 12px;

      color: #ffffff;

      letter-spacing: -1px;
    }


    /* =========================================
       SUBTITLE
    ========================================= */

    .subtitle {
      color: #f0c75e;

      font-size: 17px;

      margin-bottom: 32px;

      font-weight: bold;
    }

    .subtitle span {
      color: #f0c75e;

      font-weight: bold;
    }


    /* =========================================
       DIVIDER
    ========================================= */

    .divider {
      width: 100%;

      height: 2px;

      background: #d62828;

      margin-bottom: 35px;

      opacity: 0.7;
    }


    /* =========================================
       CV LIST
    ========================================= */

    ul {
      list-style: none;

      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    /* =========================================
       CV CARDS
    ========================================= */

    li {
      background: #f4ead2;

      border: 1px solid #d8c79f;

      border-radius: 8px;

      overflow: hidden;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.16);
    }

    li:hover {
      transform: translateX(7px);

      background: #fff4d6;

      border-color: #d62828;

      box-shadow:
        0 9px 25px rgba(0, 0, 0, 0.22),
        0 0 15px rgba(214, 40, 40, 0.12);
    }


    /* =========================================
       LINKS
    ========================================= */

    a {
      text-decoration: none;

      color: #173b5c;

      display: flex;

      align-items: center;

      width: 100%;

      min-height: 76px;

      padding: 18px 22px;

      font-size: 18px;

      font-weight: bold;
    }


    /* =========================================
       NUMBER
    ========================================= */

    .number {
      width: 40px;
      height: 40px;

      min-width: 40px;

      border: 2px solid #d62828;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #b52b2b;

      font-size: 13px;

      margin-right: 18px;

      background: #fff8e7;

      flex-shrink: 0;

      transition: 0.25s ease;
    }

    li:hover .number {
      background: #d62828;

      color: #ffffff;
    }


    /* =========================================
       NAME
    ========================================= */

    .name {
      flex: 1;

      min-width: 0;

      line-height: 1.4;
    }


    /* =========================================
       ARROW
    ========================================= */

    .arrow {
      margin-left: 15px;

      color: #b52b2b;

      font-size: 25px;

      flex-shrink: 0;

      transition: 0.25s ease;
    }

    li:hover .arrow {
      color: #d19a2a;

      transform: translateX(6px);
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 700px) {

      body {
        padding: 60px 20px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 16px;

        margin-bottom: 28px;
      }

      .divider {
        width: 100%;

        margin-bottom: 28px;
      }

      a {
        min-height: 70px;

        padding: 16px 18px;

        font-size: 17px;
      }

      .number {
        width: 38px;
        height: 38px;

        min-width: 38px;

        margin-right: 14px;
      }
    }


    /* =========================================
       PHONE
    ========================================= */

    @media (max-width: 480px) {

      body {
        padding: 45px 16px;
      }

      .container {
        width: 100%;
      }

      h1 {
        font-size: 29px;

        letter-spacing: -0.5px;

        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 14px;

        margin-bottom: 24px;
      }

      .divider {
        width: 100%;

        margin-bottom: 22px;
      }

      ul {
        gap: 10px;
      }

      li {
        border-radius: 7px;

        box-shadow:
          0 3px 10px rgba(0, 0, 0, 0.15);
      }

      a {
        min-height: 66px;

        padding: 14px 13px;

        font-size: 15px;
      }

      .number {
        width: 34px;
        height: 34px;

        min-width: 34px;

        font-size: 11px;

        margin-right: 11px;
      }

      .name {
        line-height: 1.3;

        overflow-wrap: anywhere;
      }

      .arrow {
        font-size: 20px;

        margin-left: 8px;
      }
    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 350px) {

      body {
        padding: 35px 12px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13px;
      }

      .divider {
        width: 100%;
      }

      a {
        padding: 13px 11px;

        font-size: 14px;
      }

      .number {
        width: 31px;
        height: 31px;

        min-width: 31px;

        margin-right: 9px;
      }

      .arrow {
        font-size: 18px;
      }
    }

  </style>

</head>
