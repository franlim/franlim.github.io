<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mayflower CV Directory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b3d5c;
      color: #f8f5ed;
      min-height: 100vh;
      padding: 50px 8%;
      position: relative;
      overflow-x: hidden;
    }

    /* =========================================
       SUBTLE OCEAN BACKGROUND
    ========================================= */

    body::before {
      content: "";
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.025);
      top: -300px;
      right: -250px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.08);
      bottom: -250px;
      left: -200px;
      pointer-events: none;
    }

    .container {
      max-width: 900px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* =========================================
       LOGO
    ========================================= */

    .logo {
      width: 58px;
      height: 58px;

      background: #f8f5ed;
      color: #d62828;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
      font-weight: bold;

      border: 3px solid #d62828;

      margin-bottom: 35px;

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

      transition: 0.25s ease;
    }

    .logo:hover {
      transform: rotate(-8deg) scale(1.05);
    }

    /* =========================================
       HEADER
    ========================================= */

    h1 {
      font-size: 38px;
      line-height: 1.2;
      margin-bottom: 12px;

      color: #ffffff;

      letter-spacing: -1px;
    }

    .subtitle {
      color: #b9d0dc;
      font-size: 17px;
      margin-bottom: 40px;
    }

    .subtitle span {
      color: #f0c75e;
      font-weight: bold;
    }

    /* =========================================
       DIVIDER
    ========================================= */

    .divider {
      height: 1px;

      background: #d62828;

      margin-bottom: 45px;

      opacity: 0.7;
    }

    /* =========================================
       CV LIST
    ========================================= */

    ul {
      list-style: none;

      display: flex;
      flex-direction: column;

      gap: 13px;
    }

    li {
      background: #123f59;

      border: 1px solid #285b73;

      border-radius: 6px;

      overflow: hidden;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    li:hover {
      transform: translateX(7px);

      background: #164b68;

      border-color: #d62828;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18),
        0 0 15px rgba(214, 40, 40, 0.08);
    }

    /* =========================================
       LINKS
    ========================================= */

    a {
      text-decoration: none;

      color: #f8f5ed;

      display: flex;
      align-items: center;

      padding: 20px 24px;

      font-size: 18px;
      font-weight: bold;
    }

    /* =========================================
       NUMBER CIRCLE
    ========================================= */

    .number {
      width: 38px;
      height: 38px;

      border: 1px solid #d62828;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #f0c75e;

      font-size: 14px;

      margin-right: 18px;

      background: rgba(0, 0, 0, 0.08);

      flex-shrink: 0;

      transition: 0.25s ease;
    }

    li:hover .number {
      background: #d62828;
      color: #ffffff;
    }

    /* =========================================
       ARROW
    ========================================= */

    .arrow {
      margin-left: auto;

      color: #9bb6c3;

      font-size: 24px;

      transition: 0.25s ease;
    }

    li:hover .arrow {
      color: #f0c75e;
      transform: translateX(6px);
    }

    /* =========================================
       FOOTER
    ========================================= */

    footer {
      border-top: 1px solid #285b73;

      margin-top: 40px;

      padding-top: 28px;

      text-align: center;

      color: #8eabb9;

      font-size: 14px;
    }

    footer span {
      color: #d62828;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 35px 20px;
      }

      .logo {
        width: 52px;
        height: 52px;
        font-size: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 15px;
        margin-bottom: 30px;
      }

      .divider {
        margin-bottom: 30px;
      }

      ul {
        gap: 10px;
      }

      a {
        padding: 17px;
        font-size: 16px;
      }

      .number {
        width: 34px;
        height: 34px;

        margin-right: 13px;

        font-size: 12px;
      }

      .arrow {
        font-size: 20px;
      }

      footer {
        margin-top: 30px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo">
      ☠
    </div>

    <!-- HEADER -->
    <h1>Mayflower CV Directory</h1>

    <div class="divider"></div>

      </li>

      <li>
        <a href="salinas.html" target="_blank">

      </li>

      <li>
        <a href="zarate.html" target="_blank">

        </a>
      </li>

      <li>
        <a href="estrada.html" target="_blank">

        </a>

    </ul>

    <!-- FOOTER -->
    <footer>

  </div>

</body>
</html>
